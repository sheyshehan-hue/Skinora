<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skinora | Authentic Luxury Skincare & Fragrance in Sri Lanka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: a slim dark toolbar on top, the site fills everything below it */
:root { --bar: #141414; --text: #F6F1E8; --muted: #A9A296; --gold: #C6A15B; --line: #2C2A27; --site: #F6F2EC;
  --serif: "Cormorant Garamond", Georgia, serif; --sans: "Jost", "Helvetica Neue", Arial, sans-serif; color-scheme: dark }
html, body { height: 100% }
body { margin: 0; background: var(--bar); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column; overflow: hidden }
:root { padding: 0 !important }
.bar { flex: none; display: flex; align-items: center; gap: 6px; padding-block: 8px; padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none }
.bar::-webkit-scrollbar { display: none }
.mark { font-family: var(--serif); font-size: 18px; letter-spacing: .3em; margin-right: 4px; white-space: nowrap }
.tag { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-right: 10px; white-space: nowrap }
.sp { flex: 1 }
.b { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px;
  font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); white-space: nowrap; border: 1px solid transparent }
.b:hover { border-color: var(--line); background: #1E1D1B }
.b[aria-pressed="true"] { background: var(--text); color: var(--bar) }
.b.primary { border-color: var(--gold); color: var(--gold) }
.b:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.b svg { width: 15px; height: 15px; flex: none }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex: none }
iframe { flex: 1; width: 100%; border: 0; background: var(--site); display: block }
.toast { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: var(--bar); color: var(--text); border: 1px solid var(--line);
  font-size: 13px; line-height: 1.5; padding: 12px 16px; border-radius: 8px; max-width: calc(100vw - 32px); z-index: 5; text-align: center }
.toast a { color: var(--gold) }
@media (max-width: 560px) { .tag, .lbl { display: none } .b { padding: 0 9px; height: 36px } .mark { font-size: 15px } .sep { margin: 0 } }
</style>

<div class="bar" role="toolbar" aria-label="Preview controls">
  <span class="mark">SKINORA</span><span class="tag">Preview</span>
  <button class="b" id="home" title="Home page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span class="lbl">Home</span>
  </button>
  <button class="b" id="back" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Back</span>
  </button>
  <span class="sep"></span>
  <button class="b" id="store" aria-pressed="true">Store</button>
  <button class="b" id="admin" aria-pressed="false">Admin</button>
  <span class="sp"></span>
  <button class="b primary" id="fs" title="Full screen">
    <svg id="fs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl" id="fs-label">Full screen</span>
  </button>
</div>
<iframe id="site" allow="camera" src="home.html" title="Skinora website"></iframe>
<div class="toast" id="toast" hidden>Full screen isn't allowed here. <a href="https://claude.ai/artifact/LQzf4SFwmEeP9jTSXS3qjp" target="_blank" rel="noopener">Open the preview in a new tab</a> for the biggest view.</div>

<script>
const site = document.getElementById("site"), $ = (i) => document.getElementById(i);
// Pages report themselves by postMessage, so Back and the Store/Admin highlight work even where the frame can't be read directly.
const trail = [];
let goingBack = false;
const go = (f) => { site.src = f + (f === current() ? "?r=" + Date.now() : ""); };
const current = () => trail[trail.length - 1] || "home.html";
const mark = (f, title) => {
  if (goingBack) goingBack = false;
  else if (f !== current() || !trail.length) trail.push(f);
  if (title) document.title = title;
  const isAdmin = f.startsWith("admin");
  $("store").setAttribute("aria-pressed", String(!isAdmin)); $("admin").setAttribute("aria-pressed", String(isAdmin));
};
window.addEventListener("message", (e) => {
  if (e.source !== site.contentWindow || !e.data || typeof e.data.skPage !== "string") return;
  mark(e.data.skPage, e.data.title);
});
$("home").onclick = () => go("home.html");
$("store").onclick = () => go("home.html");
$("admin").onclick = () => go("admin.html");
$("back").onclick = () => {
  if (trail.length < 2) return go("home.html");
  trail.pop(); goingBack = true; site.src = trail[trail.length - 1];
};
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$("fs").onclick = async () => {
  const el = document.documentElement;
  try {
    if (fsEl()) { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) throw new Error("unsupported");
    await req.call(el);
  } catch (e) { const t = $("toast"); t.hidden = false; clearTimeout(window._t); window._t = setTimeout(() => (t.hidden = true), 6000); }
};
// each new page starts at the top of the preview, even when the preview sits inside a taller page
let loads = 0;
site.addEventListener("load", () => { if (loads++ === 0) return; try { window.scrollTo(0, 0); document.body.scrollIntoView({ block: "start" }); } catch (e) {} });
const sync = () => { $("fs-label").textContent = fsEl() ? "Exit full screen" : "Full screen"; };
document.addEventListener("fullscreenchange", sync); document.addEventListener("webkitfullscreenchange", sync);
</script>

</body></html>
